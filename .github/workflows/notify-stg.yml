# API 本体の develop 更新を api-infra へ通知する（STG 再デプロイのトリガー）。
# infra リポジトリ側の deploy-stg.yml が repository_dispatch(character-api-updated) を受けて
# 自宅 STG の compose を rebuild する。これが無いと「infra リポジトリに変更が無い限り
# STG の API が古いまま」になる。
#
# 必要な Secrets: GH_PAT（repo スコープ。repository_dispatch の送信は GITHUB_TOKEN では不可）
name: Notify STG (api updated)

on:
  push:
    branches: [develop]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to api-infra
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api "repos/${{ github.repository_owner }}/character-api-go-infra/dispatches" \
            -f event_type=character-api-updated \
            -F "client_payload[sha]=${{ github.sha }}"
