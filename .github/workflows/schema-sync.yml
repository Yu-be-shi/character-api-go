# イベント駆動のスキーマ同期（プル型）。
#
# character-db 側の CI がスキーマ変更のマージ時に repository_dispatch
# （event_type: character-db-updated, client_payload: {sha, ref}）を送ってくる。
# それをトリガーに、このリポジトリが自発的に:
#   1. character-db を通知された SHA で取得し、使うスキーマファイルだけを
#      third_party/character-db/ に上書きコピー（vendoring）する
#   2. sqlc generate を再実行する（スキーマと query.sql の不整合はここで顕在化）
#   3. 差分があれば「スキーマ追従」PR を自動作成する（PR の通常 CI が
#      build / test / 統合テストを実行し、壊れていれば PR 上で赤くなる）
#
# submodule はやめ、必要なファイルだけを通常ファイルとして取り込む方式に変更した。
# 取り込むファイルを増減したいときは、下記 VENDOR_FILES と sqlc.yaml / 統合テストを合わせて直す。
#
# 必要な Secrets:
#   GH_PAT … repo スコープの PAT。private な character-db の取得と、PR 作成に使う。
#            （GITHUB_TOKEN で作った PR は CI がトリガーされないため PAT が必要。
#             https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow）
name: Schema sync (character-db)

on:
  repository_dispatch:
    types: [character-db-updated]
  # 手動でも回せるようにしておく（通知を取り逃した場合の保険）。
  workflow_dispatch:
    inputs:
      sha:
        description: "character-db のコミット SHA（空なら develop の HEAD）"
        required: false

concurrency:
  group: schema-sync
  cancel-in-progress: true

# vendoring 対象。character-db からの相対パス＝この repo の third_party/character-db/ 配下の同じパス。
env:
  VENDOR_FILES: >-
    schema.sql
    views/00_set_updated_at.sql
    views/10_character_write_functions.sql

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GH_PAT }}

      - name: Fetch character-db at target SHA
        id: target
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          INPUT_SHA: ${{ inputs.sha }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git clone --no-checkout "https://x-access-token:${GH_PAT}@github.com/Yu-be-shi/character-db.git" /tmp/character-db
          cd /tmp/character-db
          git fetch origin develop
          SHA="${DISPATCH_SHA:-${INPUT_SHA:-}}"
          if [ -z "$SHA" ]; then
            SHA="$(git rev-parse origin/develop)"
          fi
          git checkout --detach "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Vendor schema files
        run: |
          set -euo pipefail
          for f in $VENDOR_FILES; do
            mkdir -p "third_party/character-db/$(dirname "$f")"
            cp "/tmp/character-db/$f" "third_party/character-db/$f"
          done
          printf '%s\n' "${{ steps.target.outputs.sha }}" > third_party/character-db/SOURCE_SHA

      - name: Regenerate sqlc
        id: sqlc
        # sqlc generate が失敗する＝スキーマと query.sql が非互換。
        # その場合も vendoring 更新だけの PR を作り、PR の CI とこのログで
        # 「何が壊れたか」を可視化する（黙って何もしないのが最悪）。
        run: |
          set -euo pipefail
          if make sqlc; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SQLC_RESULT: ${{ steps.sqlc.outputs.result }}
          DB_SHA: ${{ steps.target.outputs.sha }}
          DB_SHORT: ${{ steps.target.outputs.short }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "スキーマ・生成コードに差分なし。何もしない。"
            exit 0
          fi
          # ブランチ名はフル SHA で一意化（短縮 SHA の前方一致衝突を避ける）。PR タイトル等は短縮を使う。
          BRANCH="chore/schema-sync-${DB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(schema): character-db ${DB_SHORT} へ追従（vendoring 更新 + sqlc 再生成）"
          git push -u origin "$BRANCH" --force
          NOTE="sqlc generate: ${SQLC_RESULT}"
          if [ "$SQLC_RESULT" = "failed" ]; then
            NOTE="⚠️ **sqlc generate が失敗**（スキーマと query.sql が非互換）。このPRのCIログを確認し、query.sql / ドメイン型を修正してください。"
          fi
          gh pr create --base develop --head "$BRANCH" \
            --title "chore(schema): character-db ${DB_SHORT} へ追従" \
            --body "$(printf 'character-db の更新通知（repository_dispatch）による自動 PR。\n\n- 対象コミット: Yu-be-shi/character-db@%s\n- %s\n- 検証は本 PR の通常 CI（build / test / 実DB統合テスト / sqlc・swagger ドリフト検知）が行う。\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)' "$DB_SHA" "$NOTE")" \
            || echo "PR は既に存在する（同一ブランチ更新のみ）"
