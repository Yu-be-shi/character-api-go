name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 同一ブランチの古い実行はキャンセルして CI 資源を節約する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # スキーマ（schema.sql / migrations / views / seeds）は自リポジトリが所有する。
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...
        env:
          DB_DSN: "host=localhost user=app password=password dbname=testdb port=5432 sslmode=disable TimeZone=UTC"
          INTERNAL_API_KEY: test-key-for-ci

      # リポジトリ層の実 DB 統合テスト（version 競合 CH412・論理削除 CH404・FK→ErrInUse・updated_at トリガー）。
      # vendoring した実スキーマ＋ DB 関数を適用して本番同等で検証する。
      - name: integration test (repository, real DB)
        run: go test -race -tags=integration ./internal/infrastructure/persistence/postgres/...
        env:
          TEST_DB_DSN: "postgres://app:password@localhost:5432/testdb?sslmode=disable"

      # OpenAPI(Swagger) がコードと同期しているか（再生成して差分が無いこと）を検証する。
      - name: swagger up-to-date (OpenAPI drift)
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          "$(go env GOPATH)/bin/swag" init -g cmd/api/main.go -o docs --parseInternal
          git diff --exit-code docs/ || { echo "::error::swagger が古い。'make generate' を実行してコミットしてください"; exit 1; }

      # sqlc 生成物がスキーマ/クエリと同期しているか（再生成して差分が無いこと）を検証する。
      - name: sqlc up-to-date (sqlc drift)
        run: |
          docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 generate
          git diff --exit-code internal/infrastructure/persistence/postgres/sqlc/ || { echo "::error::sqlc が古い。'make sqlc' を実行してコミットしてください"; exit 1; }

  # 依存の既知脆弱性（govulncheck）と秘密混入（gitleaks）の検査。
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks は全履歴を走査する

      - uses: actions/setup-go@v5
        with:
          # 最新 stable で走らせ、標準ライブラリのパッチ済みバージョンで検査する
          # （stdlib の脆弱性は常に「最新で修正済み」なので gate が陳腐化しない）。
          go-version: stable

      # ツール自体は再現性のためバージョン固定（脆弱性 DB はオンライン照会のため陳腐化しない）。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: gosec (SAST)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          # 生成コードは SAST 対象外（sqlc 生成の SQL 文字列が G101 を誤検知するため。
          # 例: creation_token を含むクエリ定数を「ハードコードされた資格情報」と誤判定）。
          "$(go env GOPATH)/bin/gosec" -quiet -exclude-generated ./...

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dockerfile のビルド検証＋コンテナ脆弱性スキャン（trivy image, report-only SARIF）。
  docker:
    name: Docker build & scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t character-api:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: character-api:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      # Dependabot/fork PR は GITHUB_TOKEN が read-only に強制され security-events: write が
      # 無効化される（job の permissions は無視される）。そこで push か「同一リポジトリ発の
      # 非 Dependabot PR」のときだけ upload する。これで自分のブランチの PR では従来どおり
      # コードスキャン結果が更新され、Dependabot/fork PR では 403 で落ちない。
      - uses: github/codeql-action/upload-sarif@v3
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        with:
          sarif_file: trivy-image.sarif

  # スキーマ（schema.sql / migrations / views / seeds）の検証。API がスキーマを所有するため
  # この PR 自身で検証する: (1) atlas.sum 整合 (2) squawk 安全リンタ (3) 本番同等の migrate
  # イメージで「atlas apply → views → seeds」を流し切れること (4) 振る舞いテスト
  # (5) schema.sql と migrations/ の乖離検知（make migration 忘れの検出）。
  schema:
    name: Validate schema & migrations
    runs-on: ubuntu-latest
    env:
      ATLAS_IMAGE: arigaio/atlas:1.2.2
      SQUAWK_VERSION: 2.57.0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: characters_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d characters_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate atlas.sum integrity
        run: |
          docker run --rm -v ${{ github.workspace }}/migrations:/migrations \
            "$ATLAS_IMAGE" migrate validate --dir "file:///migrations"

      - name: Lint SQL (squawk)
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work node:20-slim \
            sh -c "npx --yes squawk-cli@$SQUAWK_VERSION -c squawk.toml migrations/*.sql views/*.sql seeds/*.sql"

      - name: Build migration image
        run: docker build -f Dockerfile.migrate -t cdb-migrate .

      - name: Apply migrations + views + seeds against test DB
        run: |
          docker run --rm --network host cdb-migrate \
            "--url=postgres://app:testpassword@localhost:5432/characters_test?sslmode=disable"

      - name: Behavior tests (DB functions / trigger / view)
        run: |
          docker run --rm --network host -v ${{ github.workspace }}/tests:/tests postgres:16-alpine \
            psql "postgres://app:testpassword@localhost:5432/characters_test?sslmode=disable" \
            -v ON_ERROR_STOP=1 -f /tests/behavior.sql

      - name: Check schema.sql / migrations drift
        run: |
          set -o pipefail
          docker run --rm --network host postgres:16-alpine \
            psql "postgres://app:testpassword@localhost:5432/characters_test?sslmode=disable" \
            -c "CREATE DATABASE atlas_dev;"
          docker run --rm --network host -v ${{ github.workspace }}:/workspace -w /workspace \
            "$ATLAS_IMAGE" schema diff \
            --from "file://migrations" \
            --to "file://schema.sql" \
            --dev-url "postgres://app:testpassword@localhost:5432/atlas_dev?sslmode=disable&search_path=public" \
            | tee /tmp/drift.txt
          grep -q "Schemas are synced" /tmp/drift.txt || {
            echo "::error::schema.sql と migrations/ が乖離しています（make migration を実行してください）"
            exit 1
          }
