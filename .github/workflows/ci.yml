name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 同一ブランチの古い実行はキャンセルして CI 資源を節約する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...
        env:
          DB_DSN: "host=localhost user=app password=password dbname=testdb port=5432 sslmode=disable TimeZone=UTC"
          INTERNAL_API_KEY: test-key-for-ci

      # リポジトリ層の実 DB 統合テスト（version 条件付き UPDATE・FK→422・論理削除・updated_at トリガー）。
      - name: integration test (repository, real DB)
        run: go test -race -tags=integration ./internal/infrastructure/persistence/gorm/...
        env:
          TEST_DB_DSN: "host=localhost user=app password=password dbname=testdb port=5432 sslmode=disable TimeZone=UTC"

      # OpenAPI(Swagger) がコードと同期しているか（再生成して差分が無いこと）を検証する。
      - name: swagger up-to-date (OpenAPI drift)
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          "$(go env GOPATH)/bin/swag" init -g cmd/api/main.go -o docs --parseInternal
          git diff --exit-code docs/ || { echo "::error::swagger が古い。'make generate' を実行してコミットしてください"; exit 1; }

  # 依存の既知脆弱性（govulncheck）と秘密混入（gitleaks）の検査。
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks は全履歴を走査する

      - uses: actions/setup-go@v5
        with:
          # 最新 stable で走らせ、標準ライブラリのパッチ済みバージョンで検査する
          # （stdlib の脆弱性は常に「最新で修正済み」なので gate が陳腐化しない）。
          go-version: stable

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: gosec (SAST)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -quiet ./...

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dockerfile が壊れていないこと（runtime イメージがビルドできること）を検証。
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t character-api:ci .
