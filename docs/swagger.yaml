        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_yu-be-shi_character-api_internal_interfaces_http_dto.ErrorResponse'
      security:
      - InternalAPIKey: []
      summary: キャラクター作成
      tags:
      - characters
