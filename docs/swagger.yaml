host: localhost:8080
info:
  contact: {}
  description: キャラクター管理 REST API
  title: Character API
  version: "1.0"
paths:
  /api/v1/characters:
    get:
      description: ?ids=<uuid,...> でバッチ取得、?limit= / ?offset= でページング
      parameters:
      - description: カンマ区切りの UUID（指定時はその ID のみ返す）
        in: query
        name: ids
        type: string
      - description: 最大件数（1..500）
        in: query
        name: limit
        type: integer
      - description: オフセット
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_yu-be-shi_character-api_internal_interfaces_http_dto.CharacterResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_yu-be-shi_character-api_internal_interfaces_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_yu-be-shi_character-api_internal_interfaces_http_dto.ErrorResponse'
      security:
      - InternalAPIKey: []
      summary: キャラクター一覧取得
      tags:
      - characters
    post:
      consumes:
      - application/json
      parameters:
      - description: キャラクター作成リクエスト
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_yu-be-shi_character-api_internal_interfaces_http_dto.CreateCharacterRequest'
      produces:
      - application/json
      responses:
